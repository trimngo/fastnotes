name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, lint, and compile
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease -PscreenshotDir="$RUNNER_TEMP/fastnotes-capture-checks"

      - name: Keep capture verification images and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastnotes-capture-checks
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/fastnotes-capture-checks
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
