name: Floating Memo APK
on:
  push:
    branches: [floating-memo]
  pull_request:
    branches: [main]
    paths: ['floating-memo/**', '.github/workflows/floating-memo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew --no-daemon -p floating-memo :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: floating-memo-apk
          path: floating-memo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
